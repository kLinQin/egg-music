<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0e6d2"/>
    </linearGradient>
    <linearGradient id="yolkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <g transform="translate(100, 175)">
    <path
      d="M90 0
         C 130 0, 160 50, 160 105
         C 160 160, 130 210, 90 210
         C 50 210, 20 160, 20 105
         C 20 50, 50 0, 90 0 Z"
      fill="url(#eggGrad)"
      stroke="#d4c5a8"
      stroke-width="3"
    />
    <circle cx="70" cy="115" r="20" fill="url(#yolkGrad)"/>
    <circle cx="64" cy="108" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="110" cy="115" r="20" fill="url(#yolkGrad)"/>
    <circle cx="104" cy="108" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <text x="340" y="290"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="96"
        font-weight="700"
        fill="#ffffff"
        letter-spacing="-2">
    Egg Music
  </text>

  <text x="340" y="350"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="32"
        font-weight="400"
        fill="#bbf7d0"
        letter-spacing="0.5">
    Pemutar musik lokal dengan lirik &amp; equalizer
  </text>

  <g transform="translate(340, 410)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500">
    <rect x="0" y="0" width="120" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
    <text x="60" y="29" text-anchor="middle" fill="#ffffff">Local</text>

    <rect x="135" y="0" width="130" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
    <text x="200" y="29" text-anchor="middle" fill="#ffffff">Lyrics</text>

    <rect x="280" y="0" width="160" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
    <text x="360" y="29" text-anchor="middle" fill="#ffffff">Equalizer</text>
  </g>

  <text x="1100" y="580"
        text-anchor="end"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="20"
        fill="#bbf7d0"
        opacity="0.7">
    Musik di mana saja, kapan saja
  </text>
</svg>